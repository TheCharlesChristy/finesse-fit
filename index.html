    <script>
      // Apply the saved palette/theme before first paint. App.jsx keeps this in sync.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('finesse-fit:appearance') || '{}');
          var root = document.documentElement;
          var light = saved.themeMode === 'light' || (saved.themeMode === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          root.dataset.theme = light ? 'light' : 'dark';
          if (saved.palette) root.dataset.palette = saved.palette;
        } catch (e) { /* first run or storage blocked: CSS defaults apply */ }
      })();
    </script>
