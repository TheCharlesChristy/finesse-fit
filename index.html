          var root = document.documentElement;

          root.dataset.theme = theme;

          if (saved.surface) root.dataset.surface = saved.surface;
          if (saved.density) root.dataset.density = saved.density;

          if (saved.text) root.dataset.text = saved.text;

          var vars = saved.vars && saved.vars[theme];
          if (vars) for (var name in vars) root.style.setProperty(name, vars[name]);
        } catch (e) { /* first run, or storage blocked: the CSS defaults apply */ }
      })();
